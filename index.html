<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Protected Website</title>
    
    <style>
        /* 1. ป้องกันการคลุมดำเลือกข้อความ (Disable Text Selection) */
        * {
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* IE / Edge */
            user-select: none;         /* Standard */
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: #1a73e8;
            margin-bottom: 1rem;
        }

        p {
            line-height: 1.6;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ยินดีต้อนรับสู่เว็บไซต์</h1>
        <p>เนื้อหาและข้อมูลในหน้านี้ได้รับการปกป้องด้วยระบบ Anti-Scraping</p>
    </div>

    <script>
        // ==========================================
        // 1. ป้องกันการคลิกขวา (Disable Right Click)
        // ==========================================
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // ==========================================
        // 2. ป้องกันปุ่มคีย์ลัดสำหรับเปิด Developer Tools & ดูโค้ด
        // ==========================================
        document.addEventListener('keydown', function(e) {
            // บล็อก F12
            if (e.key === 'F12') {
                e.preventDefault();
            }
            // บล็อก Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (DevTools)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
                e.preventDefault();
            }
            // บล็อก Ctrl+U (View Source)
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
            }
            // บล็อก Ctrl+S (Save Page)
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
            }
        });

        // ==========================================
        // 3. ตรวจสอบการเปิด Developer Tools (Console Debugger Protection)
        // ==========================================
        setInterval(function() {
            const startTime = performance.now();
            debugger; // หากมีคนเปิด F12 ค้างไว้ สคริปต์จะติด Debugger ทำให้เว็บทำงานช้าลงหรือค้าง
            const endTime = performance.now();
            if (endTime - startTime > 100) {
                // ตรวจพบว่ามีการเปิด DevTools
                document.body.innerHTML = '<h1 style="text-align:center; margin-top:20vh; color:red;">Access Denied: Developer Tools Detected</h1>';
            }
        }, 1000);

        // ==========================================
        // 4. เช็กพื้นฐานว่าผู้ใช้เปิด JavaScript หรือไม่
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            // สามารถเพิ่มโค้ดส่ง Token ยืนยันตัวตนไปยัง Back-end API ได้ที่นี่
            console.log("Protected Session Active");
        });
    </script>
</body>
</html>
