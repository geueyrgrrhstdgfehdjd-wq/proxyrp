<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXYRP - Client System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #030008;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(217, 70, 239, 0.15), transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(6, 182, 212, 0.1), transparent 60%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card-container {
            width: 100%;
            max-width: 410px;
            background: rgba(13, 8, 26, 0.75);
            border-radius: 30px;
            padding: 35px 26px;
            border: 1px solid rgba(217, 70, 239, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                        0 0 30px rgba(168, 85, 247, 0.15),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        /* Logo */
        .logo-wrapper {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinning-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #d946ef;
            border-right-color: #06b6d4;
            animation: spin 3s linear infinite;
            filter: drop-shadow(0 0 8px rgba(217, 70, 239, 0.6));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-img {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            z-index: 1;
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-left: 6px;
            font-weight: 300;
        }

            align-items: center;
            gap: 10px;
            margin: 22
