<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Protected Website</title>
    
    <style>
        /* 1. Disable Text Selection */
        * {
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* IE / Edge */
            user-select: none;         /* Standard */
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: #1a73e8;
            margin-bottom: 1rem;
        }

        p {
            line-height: 1.6;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Our Website</h1>
        <p>The content on this page is protected by an Anti-Scraping system.</p>
    </div>

    <script>
        // ==========================================
        // 1. Disable Right Click
        // ==========================================
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // ==========================================
        // 2. Disable Shortcut Keys for DevTools & View Source
        // ==========================================
        document.addEventListener('keydown', function(e) {
            // Block F12
            if (e.key === 'F12') {
                e.preventDefault();
            }
            // Block Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (DevTools)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
                e.preventDefault();
            }
            // Block Ctrl+U (View Source)
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
            }
            // Block Ctrl+S (Save Page)
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
            }
        });

        // ==========================================
        // 3. Console Debugger Protection
        // ==========================================
        setInterval(function() {
            const startTime = performance.now();
            debugger; // Freezes execution if DevTools is open
            const endTime = performance.now();
            if (endTime - startTime > 100) {
                // DevTools open detected
                document.body.innerHTML = '<h1 style="text-align:center; margin-top:20vh; color:red;">Access Denied: Developer Tools Detected</h1>';
            }
        }, 1000);

        // ==========================================
        // 4. Session Verification
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log("Protected Session Active");
        });
    </script>
</body>
</html>
