<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXYRP - Client System</title>
    
    <!-- ฟอนต์ Orbitron และ Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #05020a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 10, 31, 0.85);
            border-radius: 28px;
            padding: 30px 24px;
            border: 1px solid rgba(147, 51, 234, 0.3);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.15),
                        inset 0 0 15px rgba(139, 92, 246, 0.05);
            backdrop-filter: blur(10px);
            text-align: center;
            position: relative;
        }

        .hidden {
            display: none !important;
        }

        .logo-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinning-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #d946ef;
            border-right-color: #a855f7;
            border-bottom-color: rgba(168, 85, 247, 0.2);
            border-left-color: rgba(217, 70, 239, 0.2);
            animation: spin 3s linear infinite;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            z-index: 1;
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            margin-right: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
        }

        .subtitle {
            font-size: 13px;
            color: #8b8a9d;
            margin-bottom: 25px;
        }

        .login-title {
            font-size: 15px;
            color: #b0a8ca;
            font-weight: 300;
            margin-bottom: 25px;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .auth-tag {
            font-family: 'Orbitron', sans-serif;
            color: #06b6d4;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .auth-label {
            color: #ffffff;
            font-weight: 500;
        }

        .auth-line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(147, 51, 234, 0.5), transparent);
        }

        .input-group {
            text-align: left;
            margin-bottom: 25px;
        }

        .input-label {
            font-size: 13px;
            color: #a098be;
            margin-bottom: 8px;
            display: block;
            font-weight: 300;
        }

        .input-box {
            width: 100%;
            background: rgba(10, 5, 20, 0.7);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 14px 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        .input-box::placeholder {
            color: #4c4665;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #a855f7 0%, #d946ef 100%);
            border: none;
            border-radius: 25px;
            padding: 14px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(217, 70, 239, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(217, 70, 239, 0.6);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            min-height: 20px;
        }
        .text-error { color: #ef4444; }
        .text-success { color: #10b981; }

        .footer-note {
            margin-top: 15px;
            font-size: 12px;
            color: #71698a;
            font-weight: 300;
            line-height: 1.6;
        }

        /* ==================== UI หลังเข้าสู่ระบบ ==================== */
        .ui-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
            text-align: center;
        }

        .ui-brand-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #d946ef;
            letter-spacing: 1px;
        }

        .timer-box {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.4);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-label {
            font-size: 12px;
            color: #a098be;
        }

        .timer-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: #06b6d4;
            letter-spacing: 1px;
        }

        .function-card {
            background: rgba(10, 5, 20, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 18px;
            padding: 16px 18px;
            box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.1);
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 10, 35, 0.6);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .toggle-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a2438;
            transition: .3s;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: #8b8a9d;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            border-color: #d946ef;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #ffffff;
        }

        .file-section {
            margin-top: 15px;
            background: rgba(20, 10, 35, 0.6);
            border: 1px dashed rgba(168, 85, 247, 0.4);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }

        .file-input-hidden {
            display: none;
        }

        .file-select-btn {
            display: inline-block;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid #a855f7;
            color: #d946ef;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 8px;
        }

        .file-select-btn:hover {
            background: rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .file-name-display {
            font-size: 12px;
            color: #06b6d4;
            font-family: 'Orbitron', sans-serif;
            word-break: break-all;
            min-height: 18px;
        }

        .run-btn {
            width: 100%;
            margin-top: 15px;
            background: linear-gradient(90deg, #06b6d4 0%, #a855f7 50%, #d946ef 100%);
            border: none;
            border-radius: 25px;
            padding: 12px;
            color: #ffffff;
            font-size: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .run-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(217, 70, 239, 0.6);
        }

        .logout-btn {
            width: 100%;
            margin-top: 10px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 25px;
            padding: 10px;
            color: #ef4444;
            font-size: 14px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .run-status {
            margin-top: 10px;
            font-size: 12px;
            color: #10b981;
            font-family: 'Orbitron', sans-serif;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- ==================== หน้า 1: ล็อกอินใส่คีย์ ==================== -->
        <div id="loginPage">
            <div class="logo-wrapper">
                <div class="spinning-ring"></div>
                <img class="logo-img" src="https://cdn.discordapp.com/attachments/1533053333546336346/1535662070480109719/D4555718-EFA6-474F-9496-834A7CB21DF3.png?ex=6a789440&is=6a7742c0&hm=cc1492fe3b1e0db5550cdbfc398d8f539d735132a686fbc2ed04904390a768d8&" alt="PROXYRP Logo">
            </div>

            <div class="brand-name">PROXYRP</div>
            <div>
                <span class="status-badge"><span class="status-dot"></span>LIVE</span>
                <span class="subtitle">Client System</span>
            </div>

            <div class="login-title">เข้าสู่ระบบด้วยคีย์ใช้งาน</div>

            <div class="auth-divider">
                <span class="auth-tag">AUTH</span>
                <span class="auth-label">เข้าสู่ระบบ</span>
                <div class="auth-line"></div>
            </div>

            <div class="input-group">
                <label class="input-label">รหัสใช้งาน / Access Key</label>
                <input type="text" id="accessKey" class="input-box" placeholder="กรอกรหัสใช้งานของคุณ" autocomplete="off">
            </div>

            <button class="submit-btn" id="submitBtn" onclick="verifyKey()">เริ่มต้นใช้งาน</button>

            <div id="statusMsg" class="status-msg"></div>

            <div class="footer-note">
                กรุณากรอกรหัสใช้งานที่ถูกต้อง
            </div>
        </div>

        <!-- ==================== หน้า 2: หน้า UI ฟังชั่น PROXYRP ==================== -->
        <div id="uiPage" class="hidden">
            <div class="logo-wrapper">
                <div class="spinning-ring"></div>
                <img class="logo-img" src="https://cdn.discordapp.com/attachments/1533053333546336346/1535662070480109719/D4555718-EFA6-474F-9496-834A7CB21DF3.png?ex=6a789440&is=6a7742c0&hm=cc1492fe3b1e0db5550cdbfc398d8f539d735132a686fbc2ed04904390a768d8&" alt="PROXYRP Logo">
            </div>

            <div class="ui-header">
                ฟังก์ชัน <span class="ui-brand-text">PROXYRP</span>
            </div>

            <div class="timer-box">
                <span class="timer-label">เวลาใช้งานคงเหลือ:</span>
                <span class="timer-value" id="countdownDisplay">--:--:--</span>
            </div>

            <div class="function-card">
                <div class="toggle-item">
                    <span class="toggle-label">Aimlock</span>
                    <label class="switch">
                        <input type="checkbox" id="aimlockToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="toggle-item">
                    <span class="toggle-label">Aimbot</span>
                    <label class="switch">
                        <input type="checkbox" id="aimbotToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="toggle-item">
                    <span class="toggle-label">FPS 144</span>
                    <label class="switch">
                        <input type="checkbox" id="fpsToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="toggle-item">
                    <span class="toggle-label">Bypass</span>
                    <label class="switch">
                        <input type="checkbox" id="bypassToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="file-section">
                <input type="file" id="scriptFileInput" class="file-input-hidden" accept=".txt,.json,.lua" onchange="updateFileName(this)">
                <label for="scriptFileInput" class="file-select-btn">📂 เลือกไฟล์สคริปต์ (.txt / .json / .lua)</label>
                <div class="file-name-display" id="fileNameDisplay">ยังไม่ได้เลือกไฟล์</div>
            </div>

            <button class="run-btn" onclick="runScriptAndLaunchGame()">EXECUTE & LAUNCH</button>
            <button class="logout-btn" onclick="logoutAndRevokeKey()">LOGOUT & DELETE KEY</button>
            
            <div id="runStatus" class="run-status"></div>

            <div class="footer-note" style="margin-top: 15px;">
                ระบบกำลังทำงานและเตรียมการเชื่อมต่อ Free Fire TH
            </div>
        </div>
    </div>

    <script>
        // Regex บังคับมีขีด - คั่นกลางก่อนชุดตัวเลข 1-10 ตัว
        const DAY_PATTERN = /^PROXY-(\d+)D-(\d{1,10})$/i;
        const MONTH_PATTERN = /^PROXY-(\d+)M-(\d{1,10})$/i;
        const YEAR_PATTERN = /^PROXY-(\d+)Y-(\d{1,10})$/i;
        const INF_PATTERN = /^PROXY-INF-(\d{1,10})$/i;

        let countdownTimer = null;
        let remainingSeconds = 0;
        let activeKey = "";

        let revokedKeys = JSON.parse(localStorage.getItem('proxyrp_revoked_keys') || '[]');

        function verifyKey() {
            const inputKey = document.getElementById('accessKey').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!inputKey) {
                statusMsg.className = 'status-msg text-error';
                statusMsg.textContent = 'กรุณากรอกรหัสใช้งาน (Access Key)';
                return;
            }

            if (revokedKeys.includes(inputKey)) {
                statusMsg.className = 'status-msg text-error';
                statusMsg.textContent = '✕ คีย์นี้ถูกลบออกจากระบบแล้ว ไม่สามารถใช้งานได้อีก';
                return;
            }

            let valid = false;
            let durationSeconds = 0;

            // ตรวจสอบคีย์รายวัน
            const dayMatch = inputKey.match(DAY_PATTERN);
            if (dayMatch) {
                valid = true;
                const days = parseInt(dayMatch[1], 10);
                durationSeconds = days * 24 * 3600;
            } 
            else {
                // ตรวจสอบคีย์รายเดือน
                const monthMatch = inputKey.match(MONTH_PATTERN);
                if (monthMatch) {
                    valid = true;
                    const months = parseInt(monthMatch[1], 10);
                    durationSeconds = months * 30 * 24 * 3600;
                }
                else {
                    // ตรวจสอบคีย์รายปี
                    const yearMatch = inputKey.match(YEAR_PATTERN);
                    if (yearMatch) {
                        valid = true;
                        const years = parseInt(yearMatch[1], 10);
                        durationSeconds = years * 365 * 24 * 3600;
                    }
                    // ตรวจสอบคีย์ถาวร
                    else if (INF_PATTERN.test(inputKey)) {
                        valid = true;
                        durationSeconds = 999 * 365 * 24 * 3600;
                    }
                }
            }

            if (valid) {
                activeKey = inputKey;
                remainingSeconds = durationSeconds;
                statusMsg.className = 'status-msg text-success';
                statusMsg.textContent = '✓ คีย์ถูกต้อง กำลังเข้าสู่หน้า UI...';
                
                setTimeout(() => {
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('uiPage').classList.remove('hidden');
                    startCountdown();
                }, 600);

            } else {
                statusMsg.className = 'status-msg text-error';
                statusMsg.textContent = '✕ คีย์ไม่ถูกต้อง กรุณาตรวจสอบรหัสอีกครั้ง';
            }
        }

        function startCountdown() {
            clearInterval(countdownTimer);
            updateTimerDisplay();

            countdownTimer = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateTimerDisplay();
                } else {
                    clearInterval(countdownTimer);
                    alert("เวลาใช้งานของคุณหมดลงแล้ว ระบบจะนำคุณออกจาก UI");
                    exitToLogin();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            if (remainingSeconds > 300000000) {
                document.getElementById('countdownDisplay').textContent = "UNLIMITED";
                return;
            }

            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;

            const formatted = 
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');

            document.getElementById('countdownDisplay').textContent = formatted;
        }

        function logoutAndRevokeKey() {
            if (confirm("คุณต้องการออกจากระบบและลบคีย์นี้ใช่หรือไม่? (คีย์จะไม่สามารถนำกลับมาใช้ได้อีก)")) {
                if (activeKey) {
                    revokedKeys.push(activeKey);
                    localStorage.setItem('proxyrp_revoked_keys', JSON.stringify(revokedKeys));
                }
                exitToLogin();
            }
        }

        function exitToLogin() {
            clearInterval(countdownTimer);
            activeKey = "";
            document.getElementById('accessKey').value = "";
            document.getElementById('uiPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.className = 'status-msg text-error';
            statusMsg.textContent = 'ออกจากระบบแล้ว (คีย์ถูกยกเลิกการใช้งาน)';
        }

        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files && input.files.length > 0) {
                display.textContent = '📄 ' + input.files[0].name;
            } else {
                display.textContent = 'ยังไม่ได้เลือกไฟล์';
            }
        }

        function runScriptAndLaunchGame() {
            const fileInput = document.getElementById('scriptFileInput');
            const runStatus = document.getElementById('runStatus');

            if (!fileInput.files || fileInput.files.length === 0) {
                runStatus.style.color = '#ef4444';
                runStatus.textContent = '✕ กรุณาเลือกไฟล์สคริปต์ก่อนรัน';
                return;
            }

            runStatus.style.color = '#10b981';
            runStatus.textContent = '✓ กำลังรันไฟล์ และเปิด Free Fire TH...';

            setTimeout(() => {
                const freefireIntent = 'intent://launch/#Intent;package=com.dts.freefireth;scheme=freefire;end';
                const freefireUri = 'freefireth://';

                window.location.href = freefireIntent;

                setTimeout(() => {
                    window.location.href = freefireUri;
                }, 300);
            }, 1200);
        }
    </script>

</body>
</html>
