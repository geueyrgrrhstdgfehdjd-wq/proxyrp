<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER X</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0205;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: radial-gradient(circle at center, #2a0813 0%, #0d0205 100%);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .logo-wrapper {
            margin-bottom: 25px;
        }

        .logo-ring {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 5px;
            border: 2px solid #e50914;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-section {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .udid-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #20c997;
            padding: 14px;
            border-radius: 25px;
            font-size: 13px;
            text-align: center;
            outline: none;
        }

        .btn-get {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            padding: 14px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-more {
            width: 48px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.4);
        }

        .footer-text {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .warning {
            margin-top: 5px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-ring">
                <img src="https://via.placeholder.com/120" alt="Logo" class="logo-img">
            </div>
            <h1 class="title">VIPER X</h1>
        </div>

        <p class="subtitle">กด GET เพื่อดึง UDID ก่อน...</p>

        <div class="input-section">
            <label class="input-label">รหัสอุปกรณ์ / Device UDID</label>
            <div class="input-group">
                {% if udid %}
                    <input type="text" class="udid-input" value="{{ udid }}" readonly>
                {% else %}
                    <a href="/download-profile" class="btn-get">กด GET บน iPhone (Safari)</a>
                {% endif %}
                <button class="btn-more">...</button>
            </div>
        </div>

        <button class="btn-submit">เริ่มต้นใช้งาน</button>

        <div class="footer-text">
            <p>ใส่คีย์ &rarr; กด GET บน iPhone/Safari &rarr; ติดตั้งโปรไฟล์ &rarr; กลับมาเริ่มใช้งาน</p>
            <p class="warning">* ห้ามกดใน LINE/Facebook หรือแอปอื่นๆ — เปิดด้วย Safari</p>
        </div>
    </div>

</body>
</html>
