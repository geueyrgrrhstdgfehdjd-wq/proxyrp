<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXYRP - Client System</title>
    
    <!-- ฟอนต์ภาษาอังกฤษ/ตัวเลขไซเบอร์ (Orbitron) และภาษาไทย (Kanit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #05020a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* การ์ดหลักทรงมนนีออน */
        .card-container {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 10, 31, 0.85);
            border-radius: 28px;
            padding: 30px 24px;
            border: 1px solid rgba(147, 51, 234, 0.3);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.15),
                        inset 0 0 15px rgba(139, 92, 246, 0.05);
            backdrop-filter: blur(10px);
            text-align: center;
            position: relative;
        }

        /* ส่วนวงกลมโลโก้พร้อมขอบหมุนเรืองแสง */
        .logo-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* เส้นขอบนอกหมุนได้ (Spinning Ring) */
        .spinning-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #d946ef;
            border-right-color: #a855f7;
            border-bottom-color: rgba(168, 85, 247, 0.2);
            border-left-color: rgba(217, 70, 239, 0.2);
            animation: spin 3s linear infinite;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        /* อนิเมชันการหมุน */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* โลโก้รูปภาพตรงกลาง */
        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            z-index: 1;
        }

        /* ชื่อแบรนด์ PROXYRP */
        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        /* สถานะ LIVE */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            margin-right: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
        }

        .subtitle {
            font-size: 13px;
            color: #8b8a9d;
            margin-bottom: 25px;
        }

        .login-title {
            font-size: 15px;
            color: #b0a8ca;
            font-weight: 300;
            margin-bottom: 25px;
        }

        /* เส้นแบ่งหัวข้อ AUTH */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .auth-tag {
            font-family: 'Orbitron', sans-serif;
            color: #06b6d4;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .auth-label {
            color: #ffffff;
            font-weight: 500;
        }

        .auth-line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(147, 51, 234, 0.5), transparent);
        }

        /* ช่อง Input กรอกคีย์ */
        .input-group {
            text-align: left;
            margin-bottom: 25px;
        }

        .input-label {
            font-size: 13px;
            color: #a098be;
            margin-bottom: 8px;
            display: block;
            font-weight: 300;
        }

        .input-box {
            width: 100%;
            background: rgba(10, 5, 20, 0.7);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 14px 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        .input-box::placeholder {
            color: #4c4665;
        }

        /* ปุ่มเริ่มต้นใช้งาน */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #a855f7 0%, #d946ef 100%);
            border: none;
            border-radius: 25px;
            padding: 14px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(217, 70, 239, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(217, 70, 239, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ข้อความแจ้งเตือนผลลัพธ์ */
        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            min-height: 20px;
        }
        .text-error { color: #ef4444; }
        .text-success { color: #10b981; }

        .footer-note {
            margin-top: 15px;
            font-size: 12px;
            color: #71698a;
            font-weight: 300;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- โลโก้พร้อมขอบหมุน -->
        <div class="logo-wrapper">
            <div class="spinning-ring"></div>
            <img class="logo-img" src="https://cdn.discordapp.com/attachments/1533053333546336346/1535662070480109719/D4555718-EFA6-474F-9496-834A7CB21DF3.png?ex=6a789440&is=6a7742c0&hm=cc1492fe3b1e0db5550cdbfc398d8f539d735132a686fbc2ed04904390a768d8&" alt="PROXYRP Logo">
        </div>

        <!-- ข้อความส่วนหัว -->
        <div class="brand-name">PROXYRP</div>
        <div>
            <span class="status-badge"><span class="status-dot"></span>LIVE</span>
            <span class="subtitle">Client System</span>
        </div>

        <div class="login-title">เข้าสู่ระบบด้วยคีย์ใช้งาน</div>

        <!-- หัวข้อแท็บ -->
        <div class="auth-divider">
            <span class="auth-tag">AUTH</span>
            <span class="auth-label">เข้าสู่ระบบ</span>
            <div class="auth-line"></div>
        </div>

        <!-- ช่องใส่คีย์ -->
        <div class="input-group">
            <label class="input-label">รหัสใช้งาน / Access Key</label>
            <input type="text" id="accessKey" class="input-box" placeholder="กรอกรหัสคีย์ของคุณที่นี่..." autocomplete="off">
        </div>

        <!-- ปุ่มยืนยัน -->
        <button class="submit-btn" id="submitBtn" onclick="verifyKey()">เริ่มต้นใช้งาน</button>

        <!-- ข้อความแสดงผลการตรวจคีย์ -->
        <div id="statusMsg" class="status-msg"></div>

        <div class="footer-note">
            ระบบจะตรวจสอบคีย์กับเซิร์ฟเวอร์โดยอัตโนมัติ
        </div>
    </div>

    <script>
        const PRIMARY_KEY_URL = 'https://realxpooh.github.io/Key-v4/';
        const PROXY_KEY_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(PRIMARY_KEY_URL);

        async function verifyKey() {
            const inputKey = document.getElementById('accessKey').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');

            if (!inputKey) {
                statusMsg.className = 'status-msg text-error';
                statusMsg.textContent = 'กรุณากรอกรหัสใช้งาน (Access Key)';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังตรวจสอบคีย์...';
            statusMsg.className = 'status-msg';
            statusMsg.textContent = '';

            try {
                let rawData = '';
                const cacheBuster = '?t=' + new Date().getTime();

                try {
                    const res = await fetch(PRIMARY_KEY_URL + cacheBuster, { cache: 'no-store' });
                    if (res.ok) {
                        rawData = await res.text();
                    } else {
                        throw new Error('Primary fetch failed');
                    }
                } catch (e) {
                    const proxyRes = await fetch(PROXY_KEY_URL + '&t=' + new Date().getTime());
                    if (proxyRes.ok) {
                        rawData = await proxyRes.text();
                    } else {
                        throw new Error('Proxy fetch failed');
                    }
                }

                const cleanInputKey = inputKey.replace(/\s+/g, '');

                if (rawData && rawData.includes(cleanInputKey)) {
                    statusMsg.className = 'status-msg text-success';
                    statusMsg.textContent = '✓ คีย์ถูกต้อง เข้าสู่ระบบสำเร็จ!';
                    
                    setTimeout(() => {
                        // window.location.href = "https://your-target-url.com";
                    }, 1500);

                } else {
                    statusMsg.className = 'status-msg text-error';
                    statusMsg.textContent = '✕ คีย์ไม่ถูกต้อง หรือไม่ได้มาจากระบบ Key-v4';
                }

            } catch (error) {
                statusMsg.className = 'status-msg text-error';
                statusMsg.textContent = '✕ เกิดข้อผิดพลาดในการดึงข้อมูลจากเซิร์ฟเวอร์';
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'เริ่มต้นใช้งาน';
            }
        }
    </script>

</body>
</html>
