<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER X</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0205;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: radial-gradient(circle at center, #2a0813 0%, #0d0205 100%);
            padding: 30px 20px;
            border-radius: 20px;
        }

        /* Logo Circular Frame */
        .logo-wrapper {
            margin-bottom: 25px;
        }

        .logo-ring {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 5px;
            border: 2px solid #e50914;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Form Inputs */
        .input-section {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .btn-get {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            padding: 14px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-get:hover {
            background: #282828;
        }

        .btn-more {
            width: 48px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.4);
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #a30000;
        }

        /* Footer Instructions */
        .footer-text {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .warning {
            margin-top: 5px;
            color: #888;
        }

        /* Modal Popup Style (Simulated iOS Alert) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .ios-popup {
            background: rgba(30, 30, 30, 0.95);
            width: 80%;
            max-width: 300px;
            border-radius: 14px;
            overflow: hidden;
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .popup-body {
            padding: 20px;
            font-size: 14px;
            line-height: 1.4;
            border-bottom: 0.5px solid #444;
        }

        .popup-actions {
            display: flex;
        }

        .btn-action {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-action.cancel {
            color: #0a84ff;
            border-right: 0.5px solid #444;
        }

        .btn-action.allow {
            color: #0a84ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Header -->
        <div class="logo-wrapper">
            <div class="logo-ring">
                <img src="https://via.placeholder.com/120" alt="Logo" class="logo-img">
            </div>
            <h1 class="title">VIPER X</h1>
        </div>

        <!-- Instructions -->
        <p class="subtitle">กด GET เพื่อดึง UDID ก่อน...</p>

        <!-- Input / Action Box -->
        <div class="input-section">
            <label class="input-label">รหัสอุปกรณ์ / Device UDID</label>
            <div class="input-group">
                <button class="btn-get" id="btnGet">กด GET บน iPhone (Safari)</button>
                <button class="btn-more">...</button>
            </div>
        </div>

        <!-- Submit Button -->
        <button class="btn-submit">เริ่มต้นใช้งาน</button>

        <!-- Footer Help Text -->
        <div class="footer-text">
            <p>ใส่คีย์ &rarr; กด GET บน iPhone/Safari &rarr; ติดตั้งโปรไฟล์ &rarr; กลับมาเริ่มใช้งาน</p>
            <p class="warning">* ห้ามกดใน LINE/Facebook หรือแอปอื่นๆ — เปิดด้วย Safari</p>
        </div>
    </div>

    <!-- Simulated iOS Download Popup -->
    <div class="overlay" id="popupOverlay">
        <div class="ios-popup">
            <div class="popup-body">
                <p><strong>“viper-x.mrpcs.online”</strong> พยายามดาวน์โหลดโปรไฟล์การกำหนดค่า คุณต้องการอนุญาตหรือไม่</p>
            </div>
            <div class="popup-actions">
                <button class="btn-action cancel" id="btnIgnore">ไม่สนใจ</button>
                <button class="btn-action allow" id="btnAllow">อนุญาต</button>
            </div>
        </div>
    </div>

    <script>
        const btnGet = document.getElementById('btnGet');
        const popupOverlay = document.getElementById('popupOverlay');
        const btnIgnore = document.getElementById('btnIgnore');
        const btnAllow = document.getElementById('btnAllow');

        // แสดง Popup เมื่อกดปุ่ม GET
        btnGet.addEventListener('click', () => {
            popupOverlay.style.display = 'flex';
        });

        // ซ่อน Popup เมื่อกด ไม่สนใจ
        btnIgnore.addEventListener('click', () => {
            popupOverlay.style.display = 'none';
        });

        // เมื่อกด อนุญาต ให้โหลดไฟล์โปรไฟล์ (เปลี่ยนลิงก์ตามต้องการ)
        btnAllow.addEventListener('click', () => {
            popupOverlay.style.display = 'none';
            // window.location.href = 'your-profile.mobileconfig';
        });
    </script>
</body>
</html>
